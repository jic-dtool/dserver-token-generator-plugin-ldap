[build-system]
requires = ["flit_scm"]
build-backend = "flit_scm:buildapi"

[project]
name = "dserver-token-generator-plugin-ldap"
description = "LDAP username/password token generator plugin for dserver"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Johannes L. Hörmann", email = "johannes.laurin@gmail.com"},
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "flask>=2.0.0",
    "flask-smorest>=0.40.0",
    "ldap3>=2.9.0",
    "PyJWT>=2.0.0",
    "cryptography>=3.4.0",
    "dservercore>0.22.0",
]

[project.optional-dependencies]
test = [
    "dservercore",
    "pytest",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/jic-dtool/dserver-token-generator-plugin-ldap"
Changelog = "https://github.com/jic-dtool/dserver-token-generator-plugin-ldap/blob/main/CHANGELOG.rst"

[project.entry-points."dservercore.extension"]
ldap = "dserver_token_generator_plugin_ldap:LdapTokenGeneratorPlugin"

[tool.flit.module]
name = "dserver_token_generator_plugin_ldap"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
write_to = "dserver_token_generator_plugin_ldap/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
